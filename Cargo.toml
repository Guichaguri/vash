[workspace]
resolver = "3"
members = [
    "crates/vash-core",
    "crates/vash-store",
    "crates/vash-proto",
    "crates/vash-server",
    "crates/vash-client",
    "crates/vash-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guichaguri/vash"

[workspace.dependencies]
vash-core = { path = "crates/vash-core" }
vash-store = { path = "crates/vash-store" }
vash-proto = { path = "crates/vash-proto" }
vash-client = { path = "crates/vash-client" }
vash-server = { path = "crates/vash-server" }

heed = "0.22.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
bytes = "1"
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crossbeam-channel = "0.5"
memchr = "2"
proptest = "1"
# Linux-only, and only for `madvise` on the LMDB map. Already in the tree via
# `lmdb-master-sys`, so this adds no new crate to the build.
libc = "0.2"
# Authentication only, and off the request path: one hash and one compare per
# connection. `subtle` is what keeps the compare from leaking a timing oracle
# over the shared prefix, which is the one attack a naive `==` hands over free.
sha2 = "0.10"
subtle = "2"
# `std` so its error implements `std::error::Error` and can join an anyhow
# chain. Without it a test build works — something else in the graph turns the
# feature on — and `cargo build` does not.
getrandom = { version = "0.3", features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1


