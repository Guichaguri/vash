name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both are first-class: development happens on Windows, deployment on
        # Linux, and the LMDB flag differences between them are real (see
        # docs/plan.md §11).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-features

  # The memcached compatibility claim is only worth anything if it is checked
  # against real clients, and against real memcached. Running the identical
  # suite on both is what turns "we implemented the protocol" into "a client
  # cannot tell the difference".
  compat:
    name: memcached client compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install memcached and a real client library
        run: |
          sudo apt-get update
          sudo apt-get install -y memcached
          python3 -m pip install --user pymemcache

      - run: cargo build --release --bin kached

      # Baseline first: if the suite does not pass against upstream memcached,
      # the suite is wrong, not the server.
      - name: Against real memcached
        run: |
          memcached -d -p 11211 -m 64 -u "$(whoami)"
          for _ in $(seq 20); do
            (echo -n "" >/dev/tcp/127.0.0.1/11211) 2>/dev/null && break
            sleep 0.2
          done
          python3 tests/compat/memcached_compat.py 127.0.0.1:11211 --flush

      - name: Against kached
        run: |
          ./target/release/kached --listen 127.0.0.1:11311 --data /tmp/kached \
            --ephemeral --enable-flush &
          for _ in $(seq 40); do
            (echo -n "" >/dev/tcp/127.0.0.1/11311) 2>/dev/null && break
            sleep 0.2
          done
          python3 tests/compat/memcached_compat.py 127.0.0.1:11311 --flush --tags

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
