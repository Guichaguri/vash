name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both are first-class: development happens on Windows, deployment on
        # Linux, and the LMDB flag differences between them are real (see
        # docs/plan.md §11).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-features

  # The compatibility claim is only worth anything if it is checked against real
  # clients, and against the real servers. Running the identical suite on both
  # is what turns "we implemented the protocol" into "a client cannot tell the
  # difference".
  compat:
    name: memcached client compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install memcached and a real client library
        run: |
          sudo apt-get update
          sudo apt-get install -y memcached
          python3 -m pip install --user pymemcache

      - run: cargo build --release --bin vash-server

      # Baseline first: if the suite does not pass against upstream memcached,
      # the suite is wrong, not the server.
      - name: Against real memcached
        run: |
          memcached -d -p 11211 -m 64 -u "$(whoami)"
          for _ in $(seq 20); do
            (echo -n "" >/dev/tcp/127.0.0.1/11211) 2>/dev/null && break
            sleep 0.2
          done
          python3 tests/compat/memcached_compat.py 127.0.0.1:11211 --flush

      - name: Against vash
        run: |
          ./target/release/vash-server --listen 127.0.0.1:11311 --data /tmp/vash \
            --ephemeral --enable-flush &
          for _ in $(seq 40); do
            (echo -n "" >/dev/tcp/127.0.0.1/11311) 2>/dev/null && break
            sleep 0.2
          done
          python3 tests/compat/memcached_compat.py 127.0.0.1:11311 --flush --tags

  # Stricter than the client-library suite: identical command sequences to both
  # servers, comparing the raw response bytes. A library smooths over exact
  # error strings and edge-case verdicts; this does not.
  #
  # The reference servers come from pinned Docker images rather than from
  # whatever the runner's package index happens to hold. For a suite whose whole
  # job is byte-for-byte equality, a reference that changes with the distro is
  # not a reference — and Redis was not being compared against at all.
  differential:
    name: byte-for-byte differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin vash-server
      # Four combinations: each dialect with authentication off and on. Auth is
      # a startup flag on all three servers, so it cannot be one run.
      - name: memcached and Redis, plain and authenticated
        run: python3 tests/compat/docker_differential.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # These parsers read bytes from strangers, so they get coverage-guided fuzzing
  # on every PR rather than only the property tests. A short run per target
  # catches regressions; the nightly job below is what actually explores.
  #
  # `vcp_auth` is the one that runs on input from a connection that has
  # presented no credential at all — with authentication enabled, everything
  # else sits behind the gate it opens.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [vcp_decode, vcp_auth, memcached_text, memcached_meta, resp_decode, record_header]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> target"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Seeded from the committed corpus so the budget goes on the body
      # decoders rather than on rediscovering what a valid frame looks like.
      - name: Fuzz ${{ matrix.target }}
        run: >
          cargo fuzz run ${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          -- -max_total_time=120 -print_final_stats=1
      - name: Upload any crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  # The release artefact: one static binary that runs on any Linux, and the
  # scratch image built from it. Built on every PR so a packaging break is
  # caught by the change that caused it rather than at release time.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --bin vash-server --target x86_64-unknown-linux-musl

      # A "static" binary that turns out to be dynamically linked is a problem
      # discovered on the target machine, so it is asserted here instead.
      - name: Check the binary is actually static
        run: |
          file target/x86_64-unknown-linux-musl/release/vash-server
          ldd target/x86_64-unknown-linux-musl/release/vash-server 2>&1 | grep -q "not a dynamic executable" \
            || { echo "vash-server is dynamically linked"; exit 1; }

      - name: Check it runs and serves
        run: |
          ./target/x86_64-unknown-linux-musl/release/vash-server \
            --listen 127.0.0.1:11311 --data /tmp/vash-pkg --ephemeral &
          for _ in $(seq 40); do
            (echo -n "" >/dev/tcp/127.0.0.1/11311) 2>/dev/null && break
            sleep 0.2
          done
          printf 'set k 0 0 5\r\nhello\r\nget k\r\nquit\r\n' | timeout 5 nc 127.0.0.1 11311 | grep -q hello

      - uses: actions/upload-artifact@v4
        with:
          name: vash-server-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/vash-server

      - name: Build the container image
        run: docker build -t vash:ci .
      - name: Check the image serves
        run: |
          docker run -d --name vash-ci -p 11312:11311 vash:ci \
            --listen 0.0.0.0:11311 --data /var/lib/vash-server --ephemeral
          for _ in $(seq 40); do
            (echo -n "" >/dev/tcp/127.0.0.1/11312) 2>/dev/null && break
            sleep 0.25
          done
          printf 'version\r\nquit\r\n' | timeout 5 nc 127.0.0.1 11312 | grep -q VERSION
          docker rm -f vash-ci
