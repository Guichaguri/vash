# Example configuration. Every key shown is one the server actually honours;
# unknown keys are rejected at startup rather than silently ignored.
#
#   vash-server --config vash.example.toml

[server]
listen = "127.0.0.1:11311"
# Connections beyond this are refused rather than queued: a client told "no"
# can fall back to the origin, a client left waiting cannot.
max_connections = 10000
read_buffer = 16384

# Most bytes one connection may hold buffered, at any point in its life.
#
# The only absolute bound on what a single client can make this server hold,
# and deliberately not conditional on authentication: a command is buffered
# whole before it is parsed, so until the parser runs there is nothing to charge
# the bytes to but the socket they arrived on. A connection past this is closed.
#
# The default is the largest value this build can be configured to hold plus a
# mebibyte for framing, which is what VCP and memcached already enforced — so it
# refuses nothing that was legal before it existed. Lower it to whatever your
# largest write actually needs and the exposure drops with it:
# max_connections * max_buffered_bytes is the worst case. Startup refuses a
# value that would not fit store.max_value_bytes plus its framing.
max_buffered_bytes = 68157440

# How long a connection may send *nothing at all*, in milliseconds. 0 disables.
#
# Not an idle timeout: a pooled connection that has served requests and gone
# quiet is left alone, as docs/protocol.md promises. This covers only
# connections that have never sent a byte — a population that contains no
# legitimate client, since every real one sends its first command immediately,
# and every slowloris. Raise it or set it to 0 for a pool that opens connections
# eagerly and holds them unused.
first_byte_timeout_ms = 10000

# Ceiling on concurrent store operations, and therefore on LMDB reader slots in
# use. store.max_readers must exceed it, or reads fail with MDB_READERS_FULL
# under load; startup refuses a config where it does not.
max_blocking_threads = 128

[store]
path = "data"

# Which storage engine to open: lmdb (default) or mdbx.
#
# mdbx is libmdbx, a fork of LMDB with a growable file, a stronger no-sync mode
# and a cross-platform warm-up. It needs a binary built with the `mdbx` feature
# and is refused at startup rather than silently downgraded when that is
# missing.
#
# THE TWO ARE NOT INTERCHANGEABLE ON AN EXISTING DATABASE. They write different
# file formats, so switching empties the cache: startup refuses a directory the
# other engine wrote rather than opening it and missing on every key. Wipe the
# directory when you change this.
#
# lmdb is the default because the measurements have not yet said otherwise --
# the storage engine is about 8% of what a write costs here, so a faster B-tree
# is worth single digits end to end. What mdbx changes that lmdb cannot is
# mostly operational: map_size becomes a ceiling the file grows toward and can
# shrink back from rather than a fixed reservation, `lazy` keeps its integrity
# guarantee without LMDB's caveat about filesystem write ordering, and
# resident_mode can pin the map on Windows and macOS as well as Linux. See
# docs/mdbx-proposal.md.
backend = "lmdb"

# Independent LMDB environments, and therefore the ceiling on concurrent
# writers. 0 picks min(num_cpus, 2).
#
# Capped at two rather than at the core count, because sharding buys concurrent
# writers and nothing else — reads are already lock-free and concurrent within
# one environment — and it costs something on every write: splitting the offered
# load across N queues divides the mean batch by roughly N.
#
# The cap was 4 while commits waited for the device, because a second writer had
# real work to take. `lazy` stops them waiting, which leaves the cost without the
# benefit. Re-measured on a four-core container, SET-only, medians of three:
#
#   shards   pipeline 16   pipeline 1   batch at pipeline 1
#     1         83,925       66,605          42.3
#     2        140,767       42,357           5.5
#     4        126,292       24,901           1.9
#     8         47,554       19,922           1.5
#
# Two is the only count not beaten by four in either shape. Note map_size_mb is
# PER SHARD, so halving this halves total capacity unless you raise it — which
# costs nothing, the map being a reservation rather than an allocation.
#
# One box, one workload: a machine with many more cores under sustained write
# load may want more, and that is what this setting is for.
#
# Fixed once a database exists: changing it would route every key to a different
# environment, so startup refuses to open a store built for a different count
# rather than silently turning the whole cache into a miss.
shards = 0

# Map size PER SHARD, not in total. An address-space reservation rather than a
# preallocation — verified on both Linux and Windows — so a generous value costs
# nothing until the data arrives.
#
# The minimum is 16 MiB: below roughly 4 MiB, LMDB can report a full map
# permanently even after everything has been deleted, because the free list
# needs pages of its own to record freed pages.
map_size_mb = 4096

# How much of the file to allocate at creation, PER SHARD. 0 grows on demand.
#
# Only backend = "mdbx" does anything with this. LMDB sizes its file to
# map_size_mb when it creates it and leaves the rest sparse, so it never grows
# and never pays for growing.
#
# mdbx grows on demand, and growth is not free on the write path. Measured on
# Linux, batched writes under lazy durability ran at 0.70x LMDB with a growing
# file and 0.99x with 64 MiB preallocated -- and the same scenario collapses to
# 0.06x once a read workload has filled the page cache, because growth has to
# allocate under memory pressure and a preallocated file does not.
#
# What it costs is disk, immediately, per shard: a fresh mdbx store goes from
# 0.3 MiB to whatever this says.
#
# It is a step, not a slope. Sweeping it on a scenario writing ~1 MB, 16 MiB
# already removed the whole penalty and 64, 128 and 256 MiB all landed in one
# band with overlapping spreads -- 128 measured lower than 64. So set it a
# little above the working set you expect and no higher; more buys nothing and
# costs disk. Not a fraction of map_size_mb, which is a ceiling, not a target.
preallocate_mb = 0

max_readers = 256

# durable   fsync on every commit
# relaxed   skips the meta-page sync; loses at most the last few transactions
#           on an OS crash and cannot corrupt the database
# lazy      syncs on a timer instead of on every commit; loses writes newer than
#           the last sync_interval_ms, and keeps the database intact
#
# `ephemeral` is gone as a durability mode: it named `lazy` plus MDB_WRITEMAP,
# and that flag measured slower than going without, twice. `--ephemeral` now
# means `lazy` durability plus wipe_on_start, which is what it always was.
#
# `lazy` is the one worth understanding, because the per-commit fsync is what a
# write actually waits for: measured on a four-core container, `relaxed` spends
# 0.43 ms per record inside commit against `ephemeral`'s 0.033 ms, so 92% of it
# is the sync — and the backlog behind it is most of a write's latency.
#
# What `lazy` gives up is durability, and only back to the last periodic sync.
# What it keeps is integrity: unlike `ephemeral` the database is still
# consistent and still openable after a crash, so there is nothing to wipe.
# LMDB's condition for that is that the filesystem preserves write order and
# MDB_WRITEMAP is not used — this mode never sets it. On a filesystem that
# reorders writes you have `ephemeral`'s risk without its name, so check.
#
# `lazy` is the default. `relaxed` is the setting to reach for if you want every
# commit on the device before it is acknowledged and are willing to pay 1.7-4.5x
# for it.
durability = "lazy"

max_value_bytes = 1048576

# Start from an empty database. What --ephemeral sets, alongside `lazy`.
wipe_on_start = false

# Let LMDB write dirty pages straight into the map (MDB_WRITEMAP).
#
# What it buys everywhere is memory: LMDB stops allocating a copy of every dirty
# page, so a large transaction has a lower peak footprint.
#
# Whether it also buys speed depends on the platform, and by more than the flag
# itself is worth:
#
#   - On Linux, nothing. Measured three times — no gain under `relaxed`, a worse
#     tail when the device stalls, and 1.04x / 0.96x / 1.01x under `lazy`.
#   - Natively on Windows, 1.08x closed-loop and 1.26x pipelined writes under
#     `lazy`, on the same NVMe as the Linux run and winning every paired round.
#
# So measure it on your own platform rather than inheriting either answer. It is
# off by default because the platform where it pays is not the one most servers
# run on, and because of the next paragraph.
#
# It removes `lazy`'s integrity guarantee — LMDB keeps a NOSYNC database
# consistent only if WRITEMAP is not used, since pages are written in place with
# no ordering. A crash can then leave the database corrupt rather than merely
# missing its last second of writes. Pair it with wipe_on_start, or run it under
# `durable`, or be willing to rebuild the cache after a crash.
write_map = false

# Read every shard's data file at startup, so the map is resident before the
# first request rather than faulting in underneath it.
#
# This is the other half of inline_reads below. That knob asks you to assert a
# resident working set and removes the protection against its not being one;
# this makes the assertion true at the moment the server starts serving.
#
# The cost is startup time proportional to the data, at sequential-read
# bandwidth — seconds for a large database, against a cold start that is
# otherwise near-instant because nothing is loaded. Off by default for that
# reason.
prefault = false

# Run read-only requests on the network worker instead of handing them to the
# storage threads.
#
# The hand-off exists so a read that page-faults blocks a thread allowed to
# block, rather than an async worker serving other connections.
#
# Measured on the development machine this makes no difference — the gain is
# inside the run-to-run variance — so it is off, and worth leaving off unless
# your own measurements disagree. What it removes is the cost of a thread
# wake-up, which varies by platform far more than anything in this code.
#
# In a CPU-capped container the measurements disagree loudly: a four-core
# container serves 18,000 closed-loop GETs a second with this off and 180,000
# with it on. See docs/benchmarks.md. Prefer resident_mode below, which turns
# this on only when it is safe to.
#
# If you turn it on, turn it on because the working set is resident: when it is
# not, a cold read stalls every connection sharing that worker. Writes always
# take the hand-off, because they wait on the writer queue by design.
inline_reads = false

# Make the working set resident, keep it resident, and serve reads inline only
# if that worked.
#
# prefault and inline_reads are two halves of a bargain nothing was enforcing:
# the first makes the map resident at startup, the second bets that it still is
# on every later read. Losing that bet does not look like a slow read — it looks
# like every connection on that worker stalling at once.
#
# This does all three steps and refuses the last one unless the first two held:
#
#   1. prefault every shard
#   2. lock each map into memory, so the kernel cannot reclaim it
#   3. serve reads inline only if every shard came back locked
#
# When the lock is refused — no RLIMIT_MEMLOCK headroom, or a platform where
# LMDB's mapping cannot be found, which today is everything but Linux — the
# server says so in the log and keeps the hand-off. The failure mode is the old
# default behaviour, never a stall. `stats settings` reports what happened as
# vash_map_locked, and vash_warmed_bytes against vash_high_water_bytes says how
# much of the store that answer still covers.
#
# ON BY DEFAULT, which it could not be until two things were true. The warm ran
# at open and cost startup time proportional to the data — ~0.9 s per GiB on
# NVMe, tens of seconds for a large store. And it settled residency once, so a
# store that grew past what was locked kept serving reads inline over pages
# nothing had pinned. Both are gone: the warm is a background loop that keeps
# checking, cold start measured 1,018 ms against a 1,063 ms floor on a 2.1 GB
# store, and a store grown past its memlock ceiling now turns inline reads back
# OFF. See docs/performance-proposals.md §26.
#
# Worth 2.9x on closed-loop reads — 285,217 against 97,582 — which is the
# difference between leading both Redis and memcached on that workload and
# losing to both.
#
# What it costs: locked pages cannot be reclaimed. The kernel bounds that
# itself — mlock fails rather than evicting its way to success, and a failure
# lands on the path above. Set it false on a host where the cache is a guest
# among other memory-hungry processes and you would rather the kernel arbitrate.
#
# Implies prefault's warming, but not its startup cost: `prefault` below still
# blocks the open, and is a separate trade asked for by name.
resident_mode = true

# The largest read run, in commands, still served inline rather than handed to
# the storage pool. Only consulted when reads are inline at all — with both
# flags above clear, every run takes the pool and this says nothing.
#
# The two tiers do not win the same workloads, and the crossover is the size of
# the block. A hop is paid once per run: one command pays all of it, sixteen pay
# a sixteenth each — and once it is amortised, the pool's several threads beat
# inline reads confined to the runtime workers. Measured on a four-core
# container, closed loop against pipelined-by-16:
#
#                   pooled     inline
#   closed loop     97,582    273,933
#   pipelined      741,206   ~580,000
#
# So neither tier is right for both, and this is the line between them.
#
# Swept on a four-core container, GET, medians of three fresh servers:
#
#   threshold    closed loop    pipelined by 16
#           0         99,936            825,131
#           1        282,657            809,889
#           2        282,726            841,223
#           4        282,685            827,558
#           8        283,831            773,000
#          16        285,024            601,874
#         MAX        282,927            601,663
#
# Any value from 1 up wins the closed loop in full, because a closed-loop block
# is one command. The pipelined cliff is exactly at 16, where a sixteen-command
# block first qualifies to be inlined. So the flat region is 1 to 8, and the
# default sits in the middle of it with margin against both ends.
#
# 0 turns inlining off without touching the flags above. A very large value
# restores the unconditional behaviour every measurement before this setting was
# taken against. See docs/performance-proposals.md §23.
inline_max_commands = 4

[store.write]
# LMDB permits one writer, so writes scale only by sharing transactions. A batch
# is whatever queued while the previous commit was in flight.
max_batch = 1024
# Writes beyond this many queued are refused with OVERLOADED rather than piling
# up behind a writer that is already saturated.
queue_depth = 4096
# Artificial delay before sealing a batch. Zero adds no latency when idle and
# still batches under load; raise it only to trade latency for throughput.
linger_us = 0

# How often the writer forces committed data onto the device. 0 never does.
#
# Under `lazy` this is the loss window — an OS crash costs the writes newer than
# the last one — so it is the knob that mode is tuned with. Under `relaxed` and
# `durable` the data is already down and this only pushes the meta page, which
# is what those modes have always documented and, until this existed, nothing
# actually did: the only forced sync in the server ran at shutdown, so a killed
# process left the meta page wherever the OS had got to.
sync_interval_ms = 1000

[store.ttl]
# Expiry-index buckets round up to this. Coarser means fewer distinct index keys
# and less write amplification. It never delays a read from seeing a key as
# expired — reads check the record's exact timestamp.
bucket_granularity_ms = 1000
# The sweeper shares the writer's transaction, so reclamation costs no extra
# commit. This is also how long the writer waits for work before waking to
# sweep, which makes idle sweeps free.
sweep_interval_ms = 100
# Bounds how long one reclamation pass can hold the write transaction.
sweep_batch = 512

[store.tags]
# The registry lives entirely in RAM, so without a ceiling a client inventing
# tag names is a memory leak.
max_tags = 100000
# Tags one record may carry. Each one costs 12 bytes inside every copy of the
# record, a tag-index row on every write, and a generation comparison on every
# read of the key — the liveness check is O(tags) and runs before anything is
# served. Raising this trades read latency and write throughput for more tags
# per key; 255 is the hard ceiling, because the record header counts them in a
# single byte.
max_per_record = 32
# Tag-index entries examined per reclamation pass. While an invalidation is
# still being cleaned up these passes run back to back, so this bounds
# transaction length rather than drain rate.
reclaim_batch = 512

[store.eviction]
# Capacity watermarks, as fractions of a shard's map in use. Each level does
# strictly more than the one below, and they must increase.
#
# soft     reclamation stops waiting for its interval and runs continuously
# hard     live records start being evicted, soonest-to-expire first
# critical writes are refused with CAPACITY_FULL; reads and deletes still work
#
# Eviction is TTL-ordered, not LRU: a TTL is the client's own statement of how
# long a value is worth keeping, and tracking recency would mean writing on
# every read. Records with no TTL sort last and go only after everything else.
soft = 0.75
hard = 0.88
critical = 0.96
# Records evicted per pass, bounding how long a pass holds the write transaction.
batch = 512

[protocol]
# FLUSH / flush_all empties the whole cache for anyone who can reach the port.
# Off unless deliberately enabled; --enable-flush does the same from the CLI.
#
# The FLUSH capability bit in the native handshake reports this setting, so a
# client can tell "disabled here" from "server too old to know the opcode"
# without having to wipe a cache to find out which it is.
flush_enabled = false

# LIST_KEYS / LIST_TAGS page through the keyspace and the tag registry. Off
# unless deliberately enabled, for two separately sufficient reasons — and
# authentication retires neither, because it decides who may connect while this
# decides what any connected client may do:
#
#   Disclosure. Cache keys routinely embed user and session identifiers, so
#   enumeration turns a reachable port into a dump of who is in the cache.
#   Cost. These are the only reads whose work is not bounded by the request;
#   every other one touches as many records as the client named.
#
# They are administrative tools: a linear scan, paged by an opaque cursor.
#
# This gate covers keyspace enumeration in EVERY dialect, not only the native
# one: Redis SCAN and memcached lru_crawler metadump / mgdump are the same
# capability asked for in another vocabulary, and are refused here too. A Redis
# client will therefore see "ERR command disabled by configuration" from SCAN
# until this is turned on.
listing_enabled = false

# Records one LIST_KEYS call may examine before it stops early and hands back a
# cursor. This is what bounds how long a single request holds a read
# transaction open — the thing that blocks LMDB from reusing freed pages. A page
# that stops here still advances its cursor, so paging makes progress through a
# region of dead or non-matching records rather than stalling on it.
#
# It also caps a whole memcached lru_crawler dump. That grammar has no cursor,
# so the server pages internally and spends this budget across as many pages as
# it needs; a dump that runs out ends in a SERVER_ERROR *instead of* its
# terminator, so a truncated dump can never be mistaken for a complete one.
listing_max_scan = 100000

# Live Redis SCAN cursors held at once, and how long an idle one stays
# resumable.
#
# A SCAN cursor has to reach the client as an integer — every major client
# library parses it as one — and this store's listing cursor is a key, which
# does not fit in a u64. So the server holds the position and hands out a token.
# The oldest are dropped once this many are live, which is safe because the
# token a live iteration needs is always the newest one it was handed; what goes
# is spent tokens and abandoned iterations.
#
# A client that comes back after the TTL, or after a restart, is told
# "ERR scan cursor expired" rather than being silently restarted from the
# beginning — which would spin its pager forever without ever saying why.
scan_cursors = 1024
scan_cursor_ttl_ms = 60000

# The compatibility dialects. Both share the port with the native protocol and
# are told apart by the connection's first byte, so both are on by default and
# cost nothing until someone speaks one.
#
# Turn one off when nothing will use it: the protocol adapters are the only code
# that reads bytes from unauthenticated clients, so an unused one is attack
# surface bought for nothing. A connection opening with a disabled dialect is
# closed at first-byte detection, before its parser runs — it gets no error,
# only a disconnect, and the reason is logged here rather than sent. The
# MEMCACHED and RESP capability bits in the native handshake report these
# settings, since a client that cannot connect cannot be told anything else.
#
# The native protocol has no switch: it is the one that can report what a node
# serves. --disable-memcached and --disable-resp do the same from the CLI.
memcached_enabled = true
resp_enabled = true

[auth]
# Who may use the cache port. Off by default.
#
# The network boundary stays the primary control — a firewall rule stops a party
# who never sends a byte, where a credential only stops them after they have
# reached a parser. This adds a layer, it does not replace one. And on its own
# it does not make the connection private: unless the [tls] section below is
# configured, every key and value — and this credential — crosses the network
# in the clear, so an eavesdropper already has the data. See docs/auth.md §1.
#
# Rolling it out is two steps, because enforcement is separate from the table:
#   1. set `file` and leave `required = false`. AUTH is answered, nothing is
#      refused. Roll every client — and every peer — to send its credential.
#   2. set `required = true` and restart.
# There is deliberately no third "optional" mode: one where unauthenticated
# clients still work is not authentication.
required = false

# Path to the credential file — `<name>  sha256:<64 hex>` per line, `#`
# comments, the shape of ~/.ssh/authorized_keys. Generate a row with:
#
#   vash-server auth-gen billing-api >> /etc/vash/credentials
#
# A separate file rather than a key here, because this config is not secret and
# gets committed. On Unix it must not be group- or world-readable; startup
# refuses it otherwise, the way ssh refuses a loose private key. Reloaded on
# SIGHUP, which is the whole of the rotation story: add the new credential, roll
# the clients, remove the old one.
#
# VASH_AUTH_SECRET in the environment configures a single `default` credential
# instead, for containers where a one-row table does not justify a mount.
# Setting both is refused.
file = ""

# An unauthenticated connection is the one thing here a stranger can create, so
# it gets its own budget rather than the ordinary limits.
timeout_ms = 5000    # dropped if it has not authenticated by then
max_attempts = 3     # failed attempts before the connection is closed
# Concurrent unauthenticated connections; 0 picks a tenth of
# server.max_connections. Without it the pre-auth budget is the whole
# connection budget.
max_unauthenticated_connections = 0

# What a credential row with no `roles=` field is granted.
#
# A row can name what it may do — read, write, invalidate, list, flush, peer —
# and every command needs one of them:
#
#   web          sha256:8c21…  roles=read,write
#   invalidator  sha256:44de…  roles=invalidate
#   peer         sha256:9b07…  roles=peer
#
# Generate one with `vash-server auth-gen billing-api --roles read,write`.
# See docs/roles-proposal.md §2 for what each rung fences off, and why there is
# no `delete` role (a writer deletes any key it can name with a one-second TTL).
#
# **Leave this key commented to keep today's behaviour.** Unset means every
# role, including ones added in later versions — which is what keeps a
# credential file written before roles existed working unchanged. Spelling the
# six names out instead means *exactly* those six, so a seventh added later
# would be withheld from every bare row on upgrade. Absence is permissive,
# presence is exact.
#
# Narrow it once every row that needs more than the floor has its own `roles=`:
# from then on a row somebody adds without thinking is least-privilege rather
# than most. `[]` grants a bare row nothing at all — it authenticates and is
# then refused everything, and startup names those rows so it is not discovered
# one denial at a time.
#
# default_roles = ["read"]

[tls]
# Encryption on the wire, on a second port. Off by default, and it needs a
# binary built with `--features tls` — a `listen` here in a build without it
# refuses to start rather than quietly serving that port in the clear.
#
# This is the half authentication does not cover. A credential decides who may
# *use* the cache; without TLS every key and value, and the credential itself,
# crosses the network in the clear, so a party on the wire already has the
# data. See docs/tls-proposal.md §1, and docs/auth.md §1 for the split.
#
# A second port rather than an upgrade on the cache port, which is Redis's
# `tls-port` model: it means closing `server.listen` is what makes a deployment
# encrypted-only, and a socket that does not exist is a stronger statement than
# a policy flag. Rolling it out is the same two steps as auth:
#   1. set `listen`, `cert` and `key`. Both ports serve the same store; move
#      clients and peers across one at a time, watching `stats conns` for the
#      `vash_tls` column and `vash_tls_connections_active` against
#      `vash_connections_active`.
#   2. when nothing is left in the clear, empty `server.listen`.
listen = ""                  # e.g. "0.0.0.0:11312"; empty means no TLS listener

# PEM certificate chain, leaf first, then any intermediates. PEM private key,
# PKCS#8 or SEC1. Both are read once at startup: a certificate that will not
# parse stops the server rather than surfacing as a handshake failure on the
# first client.
#
# Prefer an ECDSA P-256 leaf over RSA-2048. The server signs once per full
# handshake, and measured on this project's own hardware that is 308us against
# 804 — a choice made when the certificate is issued and not fixable later in
# this file. See docs/benchmarks.md#what-tls-costs.
cert = ""
key = ""

# How long a handshake may take before the connection is dropped. Below
# auth.timeout_ms on purpose: a handshake is a fixed number of round trips, and
# a peer that cannot finish one in three seconds is holding a pre-auth slot
# while it fails to.
handshake_timeout_ms = 3000

# Client certificates: mTLS. "none" asks for nothing; "required" refuses any
# connection that does not present a certificate `client_ca` issued *and* whose
# name is in the credential file. There is deliberately no "optional" — a
# certificate that may be absent identifies nobody.
#
# What this buys is `auth.required` satisfied with no secrets distributed at
# all: the credential file becomes a list of names, and the secrets are
# certificates a PKI already rotates and expires. A row looks like
#
#   billing-api  mtls:billing-api.svc.internal
#
# and is satisfied by a certificate carrying that name in a Subject Alternative
# Name — never by a password, since the subject is public. Removing the row
# locks that client out on its next connection, which is what revocation means
# here: the credential table is the revocation list. There is no CRL and no
# OCSP.
#
# Only SANs are matched. A certificate whose name is only in its Common Name
# does not authenticate: CN matching was deprecated by RFC 6125 and everything
# that issues certificates puts the name in a SAN.
client_auth = "none"

# PEM bundle of the CA that issued the client certificates. Required when
# client_auth is "required". Keep it separate from the CA that issued this
# server's own certificate, or anything holding a server certificate can
# authenticate as a client.
client_ca = ""

[cluster]
# Other nodes' cache ports. Nodes are otherwise shared-nothing — clients shard
# the keyspace, nothing is replicated — and tag invalidation is the only thing
# that crosses a node boundary, because a tag's keys are spread across every
# node. Repeatable --peer flags override this list.
#
# Membership is one-sided and static: peers are configured on the *sending*
# node, so a node that lists nobody can still be somebody else's target. Listing
# yourself is harmless but wasted work.
peers = []

# local       no fan-out; the client invalidates on every node itself
# fanout      reply immediately, forward in the background
# fanout_sync reply once reachable peers have applied it
#
# Under fanout there is a window in which another node still serves records the
# invalidation covered — and, symmetrically, in which a record written there is
# treated as pre-invalidation and dropped. Both err towards a miss.
delete_by_tag = "fanout"

# Every node exchanges tag generations with each of its peers this often, on a
# timer per peer so one unresponsive node cannot slow convergence between the
# healthy ones. This is the backstop that fan-out sits on top of: it is what
# repairs a node that was down, partitioned or restarted, so it is also the
# staleness bound when a fan-out message is lost.
gossip_interval_ms = 5000

# Per exchange, including connecting. Also how long fanout_sync waits for
# acknowledgements before answering the client anyway — an unreachable peer must
# not hold up a write that has already committed locally.
fanout_timeout_ms = 2000

# Invalidations queued per peer before further ones are dropped. Dropping is
# safe rather than merely tolerable: generations merge by maximum, so
# anti-entropy delivers whatever fan-out lost. An unbounded queue against a dead
# peer would not be.
queue_depth = 1024

# What this node presents to its peers. A peer is an ordinary VCP client on the
# ordinary port, so with auth.required set it has to authenticate like any
# other — and a cluster whose peers cannot is one where writes keep working,
# invalidation silently stops converging, and every node goes on reporting
# itself healthy. Startup refuses that configuration rather than running into
# it. Empty auth_name means `default`.
auth_name = ""
# Leave empty and set VASH_CLUSTER_SECRET instead to keep the secret out of this
# file — a config file is a document that ends up in version control, and unlike
# the credential file it gets no permission check. Setting both is refused at
# startup rather than silently preferring one, so which credential a node
# presents never depends on knowing a precedence order.
auth_secret = ""


# Reach peers over TLS. Peers are ordinary VCP clients on the cache port, so
# this is the client half of [tls] — and it is why termination is in-process
# rather than a sidecar: peers dial *out*, and a proxy in front of each node
# would leave this traffic in the clear. Point `peers` at the other nodes' TLS
# ports when you turn it on, and build with `--features tls`.
tls = false

# PEM bundle of the CA that issued the peers' certificates. Required when tls
# is set: peers are verified against an explicit CA, with no fallback to the
# platform roots, because these are internal names issued by an internal
# authority and a silent fallback is a way to trust the wrong one.
tls_ca = ""

# The name peers' certificates must carry, when it is not the host in `peers`.
#
# `peers` holds host:port strings, so the name is already there when nodes are
# named by DNS. It is *not* there when they are named by IP — an address has no
# name in it, and a certificate can only match one through an IP SAN. Set this
# to the name a shared certificate carries, or issue per-node certificates with
# IP SANs and leave it empty. Getting it wrong looks like a handshake failure,
# which the log reports as a configuration error rather than as an unreachable
# peer.
tls_server_name = ""
[observability]
log_format = "pretty"   # or "json"
log_level = "info"      # overridden by RUST_LOG when set

# /metrics (Prometheus), /health and /stats (JSON), plus /slowlog and
# /hotkeys with a build that has --features introspect.
#
# Empty — the default — serves none of them. They have no authentication of
# their own and report the store's size, its hit rate and the cluster's
# membership to anyone who can reach the port, so it is opened deliberately
# rather than closed after the fact. --admin-listen does the same from the CLI.
#
# Give it a private interface. It is a separate port from cache traffic so that
# a flood of scrapes cannot crowd out real requests, which only holds if the two
# are not the same interface.
#
# /health returns 503 when a shard has reached critical pressure and is
# refusing writes: the process is up, but it is not doing its job.
#
# /slowlog answers with key digests unless protocol.listing_enabled is set, and
# /hotkeys refuses outright without it: a ranking of digests would be a list of
# numbers with nothing to act on, so there is no useful degraded form.
admin_listen = ""      # e.g. "127.0.0.1:9090"

# ---------------------------------------------------------------------------
# What was slow, and which key is hot.
#
# Both need `--features introspect` to do anything; without it these settings
# are parsed and validated but inert, so a config file stays valid across
# builds. Designed in docs/slowlog-proposal.md and priced in
# docs/benchmarks.md — 3.81 ns a request, which is 4% of what parsing one
# costs.
#
# Unlike listing and auth, these default ON. Those two are off because they
# expose data or change who may connect; these expose counters and, until
# listing is enabled, key digests rather than key names. An observability
# feature that defaults to off is one that is not running when the incident
# starts.
[observability.introspect]

# Requests at or above this many microseconds are recorded, queue wait and
# execution kept apart. 0 disables recording.
#
# There is no "record everything" setting: that is the latency histogram's job.
# 10 ms matches Redis's default and is some two hundred times this server's GET
# median.
#
# Lowering it during an incident is the intended use and is safe to do: the
# rings are striped per thread, which is what gate 3 of the proposal forced
# after a single shared ring moved closed-loop p99 by 16%.
slowlog_threshold_us = 10000

# Entries per thread-lane, not per server. The ceiling is this times the number
# of threads that have actually recorded one — a few in practice, since a lane
# is reused by whichever thread claims it next.
slowlog_max_len = 128

hotkeys_enabled = true

# One request in this many is sampled. Rounded up to a power of two so the test
# on the request path is a mask. 0 disables.
#
# A hot key is by definition one a uniform sample hits often, so this is not a
# compromise: at 128 and a million reads a second, a key taking 1% of traffic
# lands ~100 samples a second. Everything the sampler reports is an estimate
# scaled by this number, and is named as one.
hotkeys_sample_rate = 128

# Counters in each per-thread summary, which bounds both memory and
# sensitivity: a summary of m is guaranteed to hold anything above 1/m of its
# thread's sampled stream. At 64 that is roughly 1.6% — enough to find the key
# taking a third of the traffic, not the one taking half a percent.
hotkeys_counters = 64

# Rank which tags are being invalidated, on /hotkeys beside the keys.
#
# Its own switch, because it is not the same measurement. Tag invalidations are
# **counted**, not sampled: DELETE_BY_TAG is rare — one command retires a whole
# working set — and each one matters on its own, so there is no sample rate here
# and nothing it reports is an estimate.
#
# Only invalidations that took effect are counted. A tag the registry has never
# seen retires nothing, and counting it would let a client fill the ranking with
# names that never existed.
hottags_enabled = true

# Counters in each per-lane tag summary. Eviction is unlikely to happen at all
# below this many distinct tags, and a row's `invalidations_error` says whether
# it did.
hottags_counters = 64
