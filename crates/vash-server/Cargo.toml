[package]
name = "vash-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vash-server"
path = "src/main.rs"

[lib]
name = "vash_server"
path = "src/lib.rs"

[dependencies]
vash-core.workspace = true
vash-proto.workspace = true
vash-store.workspace = true
# Peers are reached with the same client any other caller would use, so the
# cluster path exercises the published protocol rather than a private shortcut.
vash-client.workspace = true

anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
getrandom.workspace = true
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

mimalloc = { version = "0.1", default-features = false, optional = true }

# TLS termination, off by default. `ring` rather than rustls' default
# `aws-lc-rs` provider on the Phase 0 measurement in docs/tls-proposal.md:
# both build with no extra tooling on both of this project's toolchains, but
# aws-lc-sys falls back to its no-assembly build when it cannot find cmake, and
# that build is roughly half the handshake rate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
# Builds the libmdbx backend into the binary, making `store.backend = "mdbx"`
# a valid configuration. Off by default: it compiles and links a second C
# library. See `docs/mdbx-proposal.md`.
mdbx = ["vash-store/mdbx"]
# Compiles TLS termination into the binary, making `tls.listen` a valid
# configuration. Off by default: a deployment that does not want TLS should not
# link a TLS stack. A `tls.listen` in a build without this is refused at
# startup rather than quietly served in the clear — see `Config::validate`.
# `vash-client/tls` too: cluster peers are ordinary VCP clients, so the client
# half is what carries peer traffic over TLS. One feature rather than two,
# because a server that terminates TLS but gossips in the clear is not a
# configuration anybody wants.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "vash-client/tls"]
# Off by default, against plan §2, which expected 10-20% from it on
# allocation-heavy connection handling. Measured on this workload it is worth
# nothing: 1.13M against 1.11M ops/s on 64-byte GETs and 537k against 540k on
# 1 KiB — noise in both directions. Kept as an option because the result is a
# statement about this workload on this platform, not about allocators.
#
#   cargo build --release --bin vash-server --features mimalloc
default = []

[dev-dependencies]
tempfile = "3"
# The TLS suite drives the server with a real rustls client and needs a
# certificate to do it. Dev-only, and the suite itself is `#![cfg(feature =
# "tls")]` — without the feature these compile and nothing uses them.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The in-memory `Store`, so the server can be tested against something that is
# not LMDB. A dev-dependency only: nothing in the shipped binary can reach it.
vash-store = { workspace = true, features = ["testing"] }
