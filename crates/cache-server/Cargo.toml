[package]
name = "cache-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kached"
path = "src/main.rs"

[lib]
name = "cache_server"
path = "src/lib.rs"

[dependencies]
cache-core.workspace = true
cache-proto.workspace = true
cache-store.workspace = true
# Peers are reached with the same client any other caller would use, so the
# cluster path exercises the published protocol rather than a private shortcut.
cache-client.workspace = true

anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
