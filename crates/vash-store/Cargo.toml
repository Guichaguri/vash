[package]
name = "vash-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vash-core.workspace = true

bytes.workspace = true
crossbeam-channel.workspace = true
heed.workspace = true
# `sync` only: a write's reply travels on a `oneshot` so the caller can *await*
# it instead of parking a thread on it. Nothing here starts or touches a
# runtime — `tokio::sync` is runtime-agnostic — and tokio is already built for
# the workspace, so this adds no crate to the graph. See `writer::Writer::send`.
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true

# `madvise` on LMDB's mapping, for `store.prefault`. Linux only: it is the one
# platform that both exposes the mapping table and has an advice that means
# "prefault this". See `src/prefault.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[features]
# A second `Store` implementation, held in memory. Off by default: it is a test
# double, not a cache, and nothing in a release build should be able to reach it.
testing = []
# The libmdbx storage backend, beside LMDB. Off by default: it compiles and
# links a second C library, and until the benchmarks say it wins there is no
# reason for every build to carry it. With it on, `store.backend = "mdbx"`
# becomes a valid configuration; without it, that setting is refused at startup
# rather than silently falling back. See `docs/mdbx-proposal.md`.
mdbx = []

[build-dependencies]
# Compiles the vendored libmdbx, and only when the `mdbx` feature is on. The
# same crate `heed` already uses to compile LMDB, so this adds nothing to a
# default build's graph.
cc = "1"

[dev-dependencies]
tempfile = "3"


