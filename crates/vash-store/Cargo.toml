[package]
name = "vash-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vash-core.workspace = true

bytes.workspace = true
crossbeam-channel.workspace = true
heed.workspace = true
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true

# `madvise` on LMDB's mapping, for `store.prefault`. Linux only: it is the one
# platform that both exposes the mapping table and has an advice that means
# "prefault this". See `src/prefault.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[features]
# A second `Store` implementation, held in memory. Off by default: it is a test
# double, not a cache, and nothing in a release build should be able to reach it.
testing = []

[dev-dependencies]
tempfile = "3"


